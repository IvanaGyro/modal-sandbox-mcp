name: Live Self-hosted OAuth and Sandbox
on:
  push:
    branches: [main]
    paths: [".github/workflows/live-oauth.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modal-live-oauth-test
  cancel-in-progress: false
jobs:
  live-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q smoke_live_oauth.py
      - run: python -m pip install 'modal>=1.6,<2'
      - name: Run live OAuth CIMD login and MCP tools/call
        run: modal run smoke_live_oauth.py
