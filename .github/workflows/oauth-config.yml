name: OAuth Configuration Check
on:
  push:
    branches: [main]
    paths: [".github/workflows/oauth-config.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'modal>=1.6,<2'
      - name: Construct and inspect GitHub OAuth proxy
        run: modal run smoke_oauth.py
