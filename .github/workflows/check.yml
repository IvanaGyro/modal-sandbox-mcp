name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax verification
        run: python -m compileall -q modal_mcp.py oauth_support.py smoke_mcp.py smoke_sandbox.py smoke_oauth.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
