name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax verification
        run: python -m compileall -q modal_mcp.py sandbox_lifecycle.py path_reader.py smoke_read_path.py transfer_http.py smoke_transfer_100mb.py oauth_support.py passphrase_oauth.py sandbox_images.py smoke_sandbox_images.py smoke_mcp.py smoke_sandbox.py smoke_oauth.py smoke_passphrase_oauth.py smoke_chatgpt_cimd.py smoke_passphrase_volume.py smoke_live_oauth.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
