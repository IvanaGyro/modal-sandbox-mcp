name: Sandbox MCP End-to-End
on:
  push:
    branches: [main]
    paths: [".github/workflows/sandbox-e2e.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modal-sandbox-e2e
  cancel-in-progress: false
jobs:
  sandbox-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'modal>=1.6,<2'
      - name: Execute authenticated MCP sandbox lifecycle
        run: modal run smoke_sandbox.py
