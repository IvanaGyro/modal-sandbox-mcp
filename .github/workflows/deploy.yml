name: Deploy to Modal
on:
  push:
    branches:
      - main
    paths:
      - "modal_mcp.py"
      - "oauth_support.py"
      - "passphrase_oauth.py"
      - "smoke_mcp.py"
      - ".github/workflows/deploy.yml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax verification and unit tests
        run: |
          python -m compileall -q modal_mcp.py oauth_support.py passphrase_oauth.py smoke_mcp.py smoke_sandbox.py smoke_oauth.py smoke_live_oauth.py tests
          python -m unittest discover -s tests -v
      - name: Verify credentials exist
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo 'MODAL_TOKEN_ID is missing' >&2; exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo 'MODAL_TOKEN_SECRET is missing' >&2; exit 1)
      - name: Install Modal SDK
        run: python -m pip install 'modal>=1.6,<2'
      - name: Deploy MCP control plane
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if modal deploy modal_mcp.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Modal deploy failed after three attempts' >&2
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - name: Verify authenticated MCP tools/list
        run: modal run smoke_mcp.py
      - name: Smoke test unauthenticated MCP request
        env:
          MCP_ENDPOINT: https://ivanagyro--modal-sandbox-mcp-mcp-web.us-east.modal.run/mcp
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deployment-smoke-test","version":"1.0"}}}'
          code=$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 -sS -o /tmp/mcp-smoke-response -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$payload" "$MCP_ENDPOINT")
          echo "Unauthenticated initialize HTTP status: $code"
          case "$code" in
            401|403) echo "MCP endpoint requires authorization" ;;
            *) echo "Unexpected unauthenticated response; review deployment" >&2; exit 1 ;;
          esac
